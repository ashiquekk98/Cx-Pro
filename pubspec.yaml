name: my_report_app
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Logic & Data
  intl: ^0.19.0
  uuid: ^4.3.3

  # Images & Files

  image_painter: ^0.7.0
  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.12.0
  
  # --- 1. MODERN DART PACKAGES ---
  # Fixes the "UnmodifiableUint8ListView" crash
  archive: ^3.6.1        
  flutter_image_compress: ^2.3.0

  # --- 2. ALIGNED PLUGINS (Both use web ^1.0.0) ---
  # These versions work together without conflict
  file_picker: ^8.1.4    
  share_plus: ^10.0.0    

  # --- 3. PLUGINS COMPATIBLE WITH SDK 34 ---
  image_picker: 1.1.1    
  path_provider: 2.1.3
  shared_preferences: 2.2.3

# --- 4. SAFETY OVERRIDES (Critical for Android Build) ---
# This forces the build to ignore the "SDK 36" requirement
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.19
  image_picker_android: 0.8.12
  path_provider_android: 2.2.6
  shared_preferences_android: 2.2.3
  file_selector_android: 0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png" # Points to your logo
  adaptive_icon_background: "#3F51B5" # Indigo background
  adaptive_icon_foreground: "assets/logo.png"
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/me.jpg
    - assets/VANTAGE.png
    - assets/BYES.png
    - assets/sign.png

  